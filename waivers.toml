# waivers.toml -- outcomes discussed and agreed to leave as they are.
#
# Enabled by CBDB_WAIVERS in .env; absent or unset means no waivers at
# all.  Every entry is keyed by a test function's own name (quote the key
# if it carries a module: ["test_exports.py::test_x"]), optionally
# narrowed with params to the parametrisation ids pytest prints.  That is
# the only address that survives a round started with no state -- see
# tests/cbdb_desktop/waivers.py, and AGENTS.md § "How a defect is
# recorded, and how one is tolerated".
#
# Nothing here is in the issue reports by default -- neither the table nor
# any filed issue every one of whose tests it covers (the maintainer's
# ruling of 2026-10-01).  run_tests.ps1 -IncludeWaived prints both, with
# the reason, who agreed and when.  Every applied waiver is still recorded
# in artifacts/waivers_applied.json, so nothing is tolerated unrecorded.
#
# mode defaults to "tolerate": the test still runs and its failure is
# tolerated, so the day the problem disappears the run reports an
# unexpected pass and the entry gets removed.  Deleting an entry is how a
# waiver ends; there is no "fixed" state to record here.


# --- One result per application, not per tab ------------------------------
#
# The application keeps a query's result in scratch tables that are one
# set per database, and nothing in a request identifies the tab it came
# from.  So a second query in another tab replaces what the first was
# about to export.  (A second copy of cbdb.exe against the same database
# was a third measurement of this agreement; 20260925 takes an OS lock
# on the database and refuses it, so that waiver was retired.)
#
# Agreed to leave alone: giving each session its own namespace is a
# redesign of how every form stores its working state, and the users of
# this build work in one window at a time.  The two entries below are
# one agreement, split only because they are two separate measurements
# of it -- the export and the working list.
#
# raises narrows each one to the recognised signature, so an unrelated
# failure of the same test (a 500, a malformed response, a different
# wrong answer) is still a failure rather than being covered by this.

[test_a_second_query_replaces_what_the_first_would_export]
raises    = "KnownShippedDefect"
reason    = "Agreed to leave as it is: the scratch tables are one set per database, so a query in a second tab replaces what the first tab would export.  Namespacing them per session is a redesign of every form's working state, and this build's users work in one window at a time."
reason_zh = "已協商暫時維持現狀：暫存表每個資料庫只有一組，因此在第二個分頁執行查詢，會取代第一個分頁即將匯出的內容。若要改成依工作階段（session）劃分命名空間，等於重新設計所有表單儲存工作狀態的方式；而這一版的使用者一次只會開一個視窗作業。"
agreed_by = "maintainer"
agreed_on = 2026-09-09

[test_a_second_working_list_replaces_the_first]
raises    = "KnownShippedDefect"
reason    = "The same agreement, one step earlier: two tabs of one form share a single working list, so the second import replaces the first and the query that follows is about the wrong people.  Left alone for the same reason."
reason_zh = "同一項協商，發生在更早的一步：同一個表單的兩個分頁共用一份工作清單，因此第二次匯入會取代第一次，接下來的查詢對象也就換成了另一批人。基於同樣的理由暫時維持現狀。"
agreed_by = "maintainer"
agreed_on = 2026-09-09


# --- The Person Browser writes the Kinship form's scratch tables ----------
#
# A separate agreement from the one above, though the circumstance is the
# same.  The Browser's kinship lookup (GET /api/browser/person/{id}/kinship,
# also reached by Export Profile) clears and refills ZZ_KIN_LIST,
# ZZ_KIN_LIST_TMP, ZZ_SCRATCH_KIN and ZZ_SCRATCH_KINNET -- the tables the
# Kinship form's query left its answer in.  The Kinship form's Export
# Query Results and Store Person IDs then read the Browser's person
# instead.  It is cross-*form* sharing, not cross-tab: the 2026-09-07
# per-form split left the Browser out.  But it can only be reached with
# the Browser and the Kinship form open in two tabs at once, which is the
# circumstance the agreement above already accepts.  In one tab, returning
# to Kinship reloads it with no result and its export and store buttons
# grey -- as long as the page's Cache-Control: no-store keeps it out of
# the browser's back/forward cache.  A browser that restored the live
# page on Back would make this reachable in one tab, and nothing in the
# suite checks that; if one does, this agreement needs revisiting.
#
# Agreed to leave for now, for that reason.  The fix is local (give the
# Browser its own kinship scratch tables).  The finding stays filed and
# is printed, with that fix, when the report is generated with
# -IncludeWaived; the default report leaves it out.  The two
# entries are one agreement over its two measurements: the export, and
# the stored list.

[test_looking_a_person_up_does_not_discard_a_kinship_result]
raises    = "KnownShippedDefect"
reason    = "Agreed to leave for now: looking a person up in the Browser's Kinship tab replaces the Kinship form's result, so its Export Query Results exports the Browser person's network.  It takes the Browser and the Kinship form open in two tabs at once, the circumstance the one-window agreement already accepts (in one tab, returning to Kinship reloads it with nothing to export, as long as no-store keeps it out of the back/forward cache).  The fix -- the Browser's own kinship scratch tables -- is local; the finding stays filed and is printed when the report is generated with -IncludeWaived."
reason_zh = "已協商暫時維持現狀：在人物瀏覽的「親屬關係」分頁查看某人，會取代親屬表單的查詢結果，使「匯出查詢結果」匯出的是人物瀏覽中那個人的網絡。這必須同時在兩個分頁開著人物瀏覽與親屬表單才會發生，與「一次只用一個視窗」那項協商所接受的情境相同（在同一個分頁中回到親屬表單時，頁面會重新載入、沒有可匯出的結果——前提是 no-store 讓它不進入瀏覽器的上一頁／下一頁快取）。修法（讓人物瀏覽擁有自己的親屬暫存表）是局部的；此問題仍然立案，以 -IncludeWaived 產生報告時會列出。"
agreed_by = "maintainer"
agreed_on = 2026-09-30

[test_looking_a_person_up_does_not_change_what_kinship_stores]
raises    = "KnownShippedDefect"
reason    = "The same agreement, its second measurement: after the same Browser lookup, the Kinship form's Store Person IDs adds the Browser's person to the stored list.  Left alone for the same reason."
reason_zh = "同一項協商的第二項測量：同樣在人物瀏覽查看之後，親屬表單的「儲存人物ID」會把人物瀏覽中的那個人加進儲存清單。基於同樣的理由暫時維持現狀。"
agreed_by = "maintainer"
agreed_on = 2026-09-30
