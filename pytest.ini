[pytest]
testpaths = tests
pythonpath = tests
# -p no:randomly / no:xdist: the application keeps one global set of
# ZZ_* scratch tables behind one session-scoped server, so shuffling the
# module order or running workers in parallel would have tests writing
# each other's state.  tests/test_stateful_forms.py depends on running
# last, and that is enforced here rather than left to luck.
addopts = -ra --strict-markers -p no:randomly -p no:xdist
markers =
    app: test drives the real cbdb.exe over HTTP (slow)
    slow: test runs a full-dataset query (minutes)
